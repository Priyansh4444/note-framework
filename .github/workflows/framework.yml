name: Framework checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  framework:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run check:all
      - run: bun run test:components:vitest
        env:
          VITE_VISUAL_BASELINE: ubuntu-24
      - run: bun run public:build
      - run: bun run test:components
        env:
          VISUAL_BASELINE: ubuntu-24
      - name: Test the public Worker and account UI
        shell: bash
        run: |
          set -euo pipefail
          bunx wrangler d1 migrations apply note-framework-public-beta --local --config wrangler.public.jsonc
          bunx wrangler d1 execute note-framework-public-beta --local --config wrangler.public.jsonc --command 'UPDATE public_settings SET enabled=1 WHERE id=1'
          bun run public:dev > /tmp/public-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3160/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3160/healthz
          PUBLIC_TEST_URL=http://localhost:3160 UI_TEST_URL=http://localhost:3160 bunx playwright test visual/public-account.visual.ts visual/public-navigation.visual.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: framework-failures
          include-hidden-files: true
          path: |
            .vitest/
            artifacts/
          retention-days: 7
